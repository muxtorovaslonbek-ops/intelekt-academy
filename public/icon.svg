<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer Glowing Circuit Orbit -->
  <circle cx="256" cy="256" r="160" stroke="url(#neon-cyan-purple)" stroke-width="6" stroke-dasharray="16 12" opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="120" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.4" />

  <!-- Neural Core Nodes -->
  <line x1="256" y1="150" x2="256" y2="362" stroke="#6366f1" stroke-width="4" opacity="0.7"/>
  <line x1="150" y1="256" x2="362" y2="256" stroke="#06b6d4" stroke-width="4" opacity="0.7"/>
  <line x1="180" y1="180" x2="332" y2="332" stroke="#a855f7" stroke-width="3" opacity="0.6"/>
  <line x1="332" y1="180" x2="180" y2="332" stroke="#a855f7" stroke-width="3" opacity="0.6"/>

  <!-- Satellite Nodes -->
  <circle cx="256" cy="130" r="16" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="382" r="16" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="130" cy="256" r="16" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="382" cy="256" r="16" fill="#a855f7" filter="url(#glow)"/>

  <!-- Center Hexagon / AI Core -->
  <polygon points="256,180 320,217 320,295 256,332 192,295 192,217" fill="#0f172a" stroke="url(#neon-cyan-purple)" stroke-width="6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />
</svg>
